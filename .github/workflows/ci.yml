name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt

      - name: Check Rust formatting
        run: |
          cargo +stable fmt --all --manifest-path core/Cargo.toml -- --check
          cargo +stable fmt --manifest-path bridge/ffi/Cargo.toml -- --check

      - name: Test Rust workspace and bridge
        run: |
          cargo +stable test --locked --workspace --manifest-path core/Cargo.toml
          cargo +stable test --locked --manifest-path bridge/ffi/Cargo.toml

  macos-build:
    name: Build Apple Silicon app
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26
        run: |
          if [ -d /Applications/Xcode_26.3.app/Contents/Developer ]; then
            sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          fi
          xcodebuild -version
          sdk_version=$(xcrun --sdk macosx --show-sdk-version)
          test "${sdk_version%%.*}" -ge 26

      - name: Install nightly Rust for the Xcode build phase
        run: rustup toolchain install nightly --profile minimal

      - name: Test macOS application discovery
        run: cargo +nightly test --locked --manifest-path core/Cargo.toml -p lumio-engine platform::macos::apps::tests

      - name: Build and verify Lumio.dmg
        run: |
          ./scripts/build.sh
          lumio=.build/release/Build/Products/Release/Lumio.app/Contents/MacOS/Lumio
          test "$(lipo -archs "$lumio")" = arm64
          frameworks=$(otool -L "$lumio")
          if grep -E '/(Translation|Vision)\.framework/' <<< "$frameworks"; then
            echo "The executable still links an OCR or translation framework" >&2
            exit 1
          fi
          hdiutil verify release/Lumio.dmg

      - name: Check the compiled app's CLI and update settings
        timeout-minutes: 2
        run: |
          app=.build/release/Build/Products/Release/Lumio.app
          lumio="$app/Contents/MacOS/Lumio"
          plist="$app/Contents/Info.plist"
          version=$(plutil -extract CFBundleShortVersionString raw -o - "$plist")
          version_output=$("$lumio" --version)
          [[ "$version_output" == "lumio $version" || "$version_output" == "lumio $version ("*')' ]]
          modes=$("$lumio" --list-modes)
          printf '%s\n' "$modes"
          awk '$1 == "apps" { apps = 1 } $1 == "folders" { folders = 1 } $1 == "processes" { processes = 1 } END { exit !(apps && folders && processes) }' <<< "$modes"

          for mode in file files clipboard clip cb clipboard-image clipimg ci dictionary dict calculator calc ocr translate translation; do
            status=0
            output=$("$lumio" --mode "$mode" 2>&1) || status=$?
            if [[ "$status" != 2 || "$output" != "lumio: unknown mode \"$mode\""* ]]; then
              echo "Unexpected response for --mode $mode (exit $status): $output" >&2
              exit 1
            fi
          done

          for key in SUFeedURL SUPublicEDKey; do
            if plutil -extract "$key" raw -o - "$plist" >/dev/null 2>&1; then
              echo "Unexpected update setting in Info.plist: $key" >&2
              exit 1
            fi
          done

      - name: Test launcher logic
        run: swift test --package-path apps/macos/LauncherApp

      - name: Upload Lumio.dmg
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Lumio-macos-arm64
          path: release/Lumio.dmg
          if-no-files-found: error
          compression-level: 0
